# ============================================================================
#  CI (Integración Continua) — verificación automática en cada push
#  ► Archivo: .github/workflows/ci.yml
#
#  Corre las verificaciones automáticas del proyecto:
#    1. validate_dataset.py          -> integridad del dataset canónico
#    2. tests/test_common_filter.py  -> tests unitarios del filtro heurístico
#    3. tests/check_dashboard.cjs    -> tests del dashboard CRM (Node.js)
#    4. Suite completa de tests      -> 98 pruebas unitarias y e2e (cobertura completa)
# ============================================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # permite lanzarlo a mano desde la pestaña "Actions"

jobs:
  validar:
    name: Dataset + Filtros + Dashboard + Suite E2E
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Instalar Node.js (tests del dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "[1/4] Validar dataset canónico"
        run: python validate_dataset.py

      - name: "[2/4] Tests del filtro heurístico"
        run: python -m unittest discover -s tests -p "test_common_filter.py" -v

      - name: "[3/4] Tests del dashboard (Node)"
        run: node tests/check_dashboard.cjs

      - name: "[4/4] Suite completa de tests (98 pruebas)"
        run: python -m unittest discover -s tests -p "test_*.py" -v
